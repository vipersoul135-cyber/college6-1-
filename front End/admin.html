<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <title>Admin Dashboard - College Attendance System</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* Admin Dashboard - compact layout (scoped to this page only) */
        .admin-dashboard {
            max-width: 480px;
            margin: 30px auto 50px;
            padding: 0 16px;
            text-align: center;
        }

        .admin-user {
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 20px;
        }

        .admin-actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            max-width: 400px;
            margin: 0 auto;
            justify-items: center;
        }

        .admin-dashboard .admin-btn {
            width: 100%;
            max-width: 190px;
            min-height: 44px;
            height: auto;
            padding: 6px 10px;
            margin: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.2;
            text-align: center;
            white-space: normal;
            border-radius: 10px;
            background: #007bff;
            color: #ffffff;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .admin-dashboard .admin-btn:hover {
            background: #0069d9;
            transform: translateY(-1px);
        }

        .admin-dashboard .admin-btn-requests {
            background: #f59e0b;
        }

        .admin-dashboard .admin-btn-requests:hover {
            background: #d97706;
        }

        .admin-dashboard .admin-btn-logout {
            background: #dc2626;
            max-width: 190px;
        }

        .admin-dashboard .admin-btn-logout:hover {
            background: #b91c1c;
        }

        .admin-logout {
            margin-top: 12px;
            display: flex;
            justify-content: center;
        }

        @media (max-width: 480px) {
            .admin-dashboard {
                margin: 20px auto 35px;
                padding: 0 12px;
            }

            .admin-actions {
                gap: 8px;
            }

            .admin-dashboard .admin-btn {
                max-width: none;
                min-height: 42px;
                padding: 6px 8px;
                font-size: 12px;
            }

            .admin-dashboard .admin-btn-logout {
                max-width: none;
            }
        }
    </style>

</head>

<body>
    <header class="header">
        <img src="logo.png" alt="Logo" class="logo" onerror="this.src='logo.png'">
        <h2 class="center" style="padding-left: 35%;">College Attendance System</h2>
    </header>

    <div class="container admin-dashboard">

        <h2 id="userInfo" class="admin-user"></h2>

        <div class="admin-actions">
            <button onclick="location.href='admin-student-requests.html'" id="btnStudentRequests" class="admin-btn admin-btn-requests">
                Student Registration Requests <span id="pendingBadge" style="display:none; background:#ef4444; color:white; border-radius:10px; padding:2px 8px; margin-left:6px; font-size:11px;">0 Pending</span>
            </button>
            <button onclick="location.href='excelupload.html'" class="admin-btn">Upload Students</button>

            <button onclick="location.href='studentsdata.html'" class="admin-btn">Students Data</button>
            <button onclick="location.href='dailyreport.html'" class="admin-btn">Daily Report</button>

            <button onclick="location.href='report.html'" class="admin-btn">Detailed Report</button>
            <button onclick="location.href='admin.html'" class="admin-btn">Refresh</button>
        </div>

        <div class="admin-logout">
            <button class="admin-btn admin-btn-logout" onclick="logout()">Logout</button>
        </div>

    </div>

    <script src="admin.js"></script>

</body>

</html>
