<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Requests - Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-requests-container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 20px;
        }

        .page-title {
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .summary-card .number {
            font-size: 36px;
            font-weight: bold;
            color: white;
            margin-bottom: 5px;
        }

        .summary-card .label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
        }

        .summary-card.total { border-left: 4px solid #3b82f6; }
        .summary-card.pending { border-left: 4px solid #fbbf24; }
        .summary-card.approved { border-left: 4px solid #4caf50; }
        .summary-card.rejected { border-left: 4px solid #f44336; }

        .toolbar {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .toolbar-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filters select {
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .btn-refresh {
            padding: 8px 20px;
            border-radius: 20px;
            background: #7c3aed;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-refresh:hover {
            background: #6d28d9;
        }

        .requests-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .requests-table th {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 15px 10px;
            text-align: left;
            font-weight: bold;
        }

        .requests-table td {
            padding: 12px 10px;
            color: white;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .requests-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-pending {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            border: 1px solid #fbbf24;
        }

        .status-approved {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border: 1px solid #4caf50;
        }

        .status-rejected {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid #f44336;
        }

        .action-buttons {
            display: flex;
            gap: 5px;
        }

        .btn-action {
            padding: 5px 12px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-view {
            background: #3b82f6;
            color: white;
        }

        .btn-approve {
            background: #4caf50;
            color: white;
        }

        .btn-reject {
            background: #f44336;
            color: white;
        }

        .btn-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: white;
            margin: 0;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }

        .modal-body {
            color: white;
        }

        .detail-row {
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .detail-row label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #fbbf24;
        }

        .detail-row .value {
            font-size: 16px;
        }

        .modal-footer {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-footer button {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.7);
        }

        .loading-message {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .summary-cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .toolbar-row {
                flex-direction: column;
            }

            .requests-table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <img src="logo.png" alt="Logo" class="logo">
        <h2 class="center" style="padding-left: 35%;">College Attendance System</h2>
    </header>

    <div class="admin-requests-container">
        <h1 class="page-title">Student Registration Requests</h1>

        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="summary-card total">
                <div class="number" id="totalCount">0</div>
                <div class="label">Total Requests</div>
            </div>
            <div class="summary-card pending">
                <div class="number" id="pendingCount">0</div>
                <div class="label">Pending</div>
            </div>
            <div class="summary-card approved">
                <div class="number" id="approvedCount">0</div>
                <div class="label">Approved</div>
            </div>
            <div class="summary-card rejected">
                <div class="number" id="rejectedCount">0</div>
                <div class="label">Rejected</div>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-row">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search by student name or register number...">
                </div>
                <div class="filters">
                    <select id="statusFilter">
                        <option value="">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                    </select>
                    <select id="departmentFilter">
                        <option value="">All Departments</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Tamil">Tamil</option>
                        <option value="English">English</option>
                    </select>
                    <select id="yearFilter">
                        <option value="">All Years</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                    </select>
                    <button class="btn-refresh" onclick="loadRequests()">🔄 Refresh</button>
                </div>
            </div>
        </div>

        <!-- Requests Table -->
        <div id="tableContainer">
            <div class="loading-message">Loading requests...</div>
        </div>

        <!-- Back Button -->
        <div class="back-button" style="text-align: center; margin-top: 30px;">
            <button onclick="window.location.href='admin.html'" style="padding: 10px 30px; background: transparent; color: white; border: 2px solid white; border-radius: 25px; cursor: pointer;">
                Back to Admin Dashboard
            </button>
        </div>
    </div>

    <!-- View Details Modal -->
    <div id="viewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Request Details</h2>
                <button class="modal-close" onclick="closeModal('viewModal')">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button onclick="closeModal('viewModal')" style="background: #6b7280; color: white;">Close</button>
            </div>
        </div>
    </div>

    <!-- Reject Modal -->
    <div id="rejectModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Reject Request</h2>
                <button class="modal-close" onclick="closeModal('rejectModal')">&times;</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 15px;">Please provide a reason for rejecting this request:</p>
                <textarea id="rejectReason" style="width: 100%; min-height: 100px; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white;" placeholder="Enter rejection reason..."></textarea>
            </div>
            <div class="modal-footer">
                <button onclick="closeModal('rejectModal')" style="background: #6b7280; color: white;">Cancel</button>
                <button onclick="confirmReject()" style="background: #f44336; color: white;">Confirm Reject</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const BASE_URL = 'http://localhost:5000/api';
        let currentUser = null;
        let allRequests = [];
        let filteredRequests = [];
        let currentRequestId = null;

        // Check authentication
        function checkAuth() {
            currentUser = getCurrentUser();
            
            if (!currentUser) {
                alert("Please login first.");
                window.location.href = "index.html";
                return false;
            }
            
            if (currentUser.role !== "admin") {
                alert("Access denied. This page is for admin only.");
                window.location.href = "admin.html";
                return false;
            }
            
            return true;
        }

        // Load all requests
        async function loadRequests() {
            if (!checkAuth()) return;

            const container = document.getElementById("tableContainer");
            container.innerHTML = '<div class="loading-message">Loading requests...</div>';

            try {
                const token = localStorage.getItem("token");
                
                const response = await fetch(`${BASE_URL}/student-requests/all`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    allRequests = data.requests || [];
                    updateSummary(data.summary);
                    applyFilters();
                } else {
                    container.innerHTML = `<div class="error-message" style="text-align: center; padding: 40px; color: #ff6b6b;">❌ ${data.message || 'Failed to load requests'}</div>`;
                }

            } catch (error) {
                console.error("Error loading requests:", error);
                container.innerHTML = '<div class="error-message" style="text-align: center; padding: 40px; color: #ff6b6b;">❌ Network error. Please check your connection.</div>';
            }
        }

        // Update summary cards
        function updateSummary(summary) {
            document.getElementById("totalCount").textContent = summary.total || 0;
            document.getElementById("pendingCount").textContent = summary.pending || 0;
            document.getElementById("approvedCount").textContent = summary.approved || 0;
            document.getElementById("rejectedCount").textContent = summary.rejected || 0;
        }

        // Apply filters
        function applyFilters() {
            const searchTerm = document.getElementById("searchInput").value.toLowerCase();
            const statusFilter = document.getElementById("statusFilter").value;
            const departmentFilter = document.getElementById("departmentFilter").value;
            const yearFilter = document.getElementById("yearFilter").value;

            filteredRequests = allRequests.filter(request => {
                const matchesSearch = 
                    request.studentName.toLowerCase().includes(searchTerm) ||
                    request.studentId.toLowerCase().includes(searchTerm);

                const matchesStatus = !statusFilter || request.status === statusFilter;
                const matchesDepartment = !departmentFilter || request.department === departmentFilter;
                const matchesYear = !yearFilter || request.year === yearFilter;

                return matchesSearch && matchesStatus && matchesDepartment && matchesYear;
            });

            displayRequests();
        }

        // Display requests
        function displayRequests() {
            const container = document.getElementById("tableContainer");

            if (filteredRequests.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>📭 No Requests Found</h3>
                        <p>No student registration requests match your filters.</p>
                    </div>
                `;
                return;
            }

            let tableHTML = `
                <table class="requests-table">
                    <thead>
                        <tr>
                            <th>S.No</th>
                            <th>Student Name</th>
                            <th>Register No</th>
                            <th>Department</th>
                            <th>Year</th>
                            <th>Requested By</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            filteredRequests.forEach((request, index) => {
                const requestDate = new Date(request.createdAt).toLocaleDateString();
                const statusClass = `status-${request.status}`;
                const statusText = request.status.charAt(0).toUpperCase() + request.status.slice(1);
                const isPending = request.status === 'pending';

                tableHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${request.studentName}</td>
                        <td><strong>${request.studentId}</strong></td>
                        <td>${request.department}</td>
                        <td>${request.year}${getYearSuffix(request.year)} Year</td>
                        <td>${request.requestedByName}</td>
                        <td>${requestDate}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-action btn-view" onclick='viewRequest(${JSON.stringify(request).replace(/'/g, "&apos;")})'>View</button>
                                ${isPending ? `
                                    <button class="btn-action btn-approve" onclick="approveRequest('${request._id}')">Approve</button>
                                    <button class="btn-action btn-reject" onclick="openRejectModal('${request._id}')">Reject</button>
                                ` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            });

            tableHTML += '</tbody></table>';
            container.innerHTML = tableHTML;
        }

        // View request details
        function viewRequest(request) {
            const modal = document.getElementById("viewModal");
            const body = document.getElementById("modalBody");

            const requestDate = new Date(request.createdAt).toLocaleString();

            body.innerHTML = `
                <div class="detail-row">
                    <label>Student Name:</label>
                    <div class="value">${request.studentName}</div>
                </div>
                <div class="detail-row">
                    <label>Register Number:</label>
                    <div class="value">${request.studentId}</div>
                </div>
                <div class="detail-row">
                    <label>Department:</label>
                    <div class="value">${request.department}</div>
                </div>
                <div class="detail-row">
                    <label>Academic Year:</label>
                    <div class="value">${request.year}${getYearSuffix(request.year)} Year</div>
                </div>
                ${request.section ? `
                <div class="detail-row">
                    <label>Section:</label>
                    <div class="value">${request.section}</div>
                </div>
                ` : ''}
                ${request.phone ? `
                <div class="detail-row">
                    <label>Phone:</label>
                    <div class="value">${request.phone}</div>
                </div>
                ` : ''}
                ${request.parentPhone ? `
                <div class="detail-row">
                    <label>Parent Phone:</label>
                    <div class="value">${request.parentPhone}</div>
                </div>
                ` : ''}
                ${request.reason ? `
                <div class="detail-row">
                    <label>Reason:</label>
                    <div class="value">${request.reason}</div>
                </div>
                ` : ''}
                <div class="detail-row">
                    <label>Requested By:</label>
                    <div class="value">${request.requestedByName} (${request.requestedById})</div>
                </div>
                <div class="detail-row">
                    <label>Request Date:</label>
                    <div class="value">${requestDate}</div>
                </div>
                <div class="detail-row">
                    <label>Status:</label>
                    <div class="value"><span class="status-badge status-${request.status}">${request.status.toUpperCase()}</span></div>
                </div>
                ${request.adminRemarks ? `
                <div class="detail-row">
                    <label>Admin Remarks:</label>
                    <div class="value">${request.adminRemarks}</div>
                </div>
                ` : ''}
            `;

            modal.classList.add('active');
        }

        // Approve request
        async function approveRequest(requestId) {
            if (!confirm("Are you sure you want to approve this request and register the student?")) {
                return;
            }

            try {
                const token = localStorage.getItem("token");
                
                const response = await fetch(`${BASE_URL}/student-requests/${requestId}/approve`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    alert("✅ Request approved successfully! Student has been registered.");
                    loadRequests(); // Refresh the list
                } else {
                    alert("❌ " + (data.message || "Failed to approve request"));
                }

            } catch (error) {
                console.error("Error approving request:", error);
                alert("❌ Network error. Please try again.");
            }
        }

        // Open reject modal
        function openRejectModal(requestId) {
            currentRequestId = requestId;
            document.getElementById("rejectReason").value = '';
            document.getElementById("rejectModal").classList.add('active');
        }

        // Confirm reject
        async function confirmReject() {
            const reason = document.getElementById("rejectReason").value.trim();

            if (!reason) {
                alert("Please provide a reason for rejection");
                return;
            }

            try {
                const token = localStorage.getItem("token");
                
                const response = await fetch(`${BASE_URL}/student-requests/${currentRequestId}/reject`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ reason })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    alert("✅ Request rejected successfully.");
                    closeModal('rejectModal');
                    loadRequests(); // Refresh the list
                } else {
                    alert("❌ " + (data.message || "Failed to reject request"));
                }

            } catch (error) {
                console.error("Error rejecting request:", error);
                alert("❌ Network error. Please try again.");
            }
        }

        // Close modal
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // Helper function
        function getYearSuffix(year) {
            if (year === '1') return 'st';
            if (year === '2') return 'nd';
            if (year === '3') return 'rd';
            return 'th';
        }

        // Event listeners
        document.addEventListener("DOMContentLoaded", function() {
            loadRequests();

            document.getElementById("searchInput").addEventListener("input", applyFilters);
            document.getElementById("statusFilter").addEventListener("change", applyFilters);
            document.getElementById("departmentFilter").addEventListener("change", applyFilters);
            document.getElementById("yearFilter").addEventListener("change", applyFilters);

            // Close modals when clicking outside
            window.addEventListener("click", function(event) {
                if (event.target.classList.contains('modal')) {
                    event.target.classList.remove('active');
                }
            });
        });
    </script>
</body>

</html>
