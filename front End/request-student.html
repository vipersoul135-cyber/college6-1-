<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Student Registration</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .request-container {
            max-width: 700px;
            margin: 30px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .page-title {
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
        }

        .staff-info-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            color: white;
        }

        .staff-info-box strong {
            color: #fbbf24;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: white;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .form-group label .required {
            color: #ff6b6b;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            box-sizing: border-box;
        }

        .form-group select option {
            background: #667eea;
            color: white;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: #2563eb;
            color: white;
        }

        .btn-submit:hover {
            background: #1d4ed8;
        }

        .btn-cancel {
            background: transparent;
            color: white;
            border: 2px solid white;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .message-area {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .message-area.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
        }

        .message-area.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .request-container {
                margin: 15px;
                padding: 20px;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <img src="logo.png" alt="Logo" class="logo">
        <h2 class="center" style="padding-left: 35%;">College Attendance System</h2>
    </header>

    <div class="request-container">
        <h1 class="page-title">Request Student Registration</h1>

        <div class="staff-info-box" id="staffInfo">
            <strong>Staff:</strong> <span id="staffName"></span> |
            <strong>Department:</strong> <span id="staffDepartment"></span> |
            <strong>Year:</strong> <span id="staffYear"></span>
        </div>

        <form id="requestForm">
            <div class="form-group">
                <label for="studentName">Student Name <span class="required">*</span></label>
                <input type="text" id="studentName" placeholder="Enter student full name" required>
            </div>

            <div class="form-group">
                <label for="studentId">Register Number <span class="required">*</span></label>
                <input type="text" id="studentId" placeholder="e.g., 21CS001" required style="text-transform: uppercase;">
            </div>

            <div class="form-group">
                <label for="department">Department <span class="required">*</span></label>
                <select id="department" required>
                    <option value="">Select Department</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Tamil">Tamil</option>
                    <option value="English">English</option>
                </select>
            </div>

            <div class="form-group">
                <label for="year">Academic Year <span class="required">*</span></label>
                <select id="year" required>
                    <option value="">Select Year</option>
                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                </select>
            </div>

            <div class="form-group">
                <label for="section">Section (Optional)</label>
                <input type="text" id="section" placeholder="e.g., A, B, C">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number (Optional)</label>
                <input type="tel" id="phone" placeholder="Enter student phone number">
            </div>

            <div class="form-group">
                <label for="parentPhone">Parent Phone (Optional)</label>
                <input type="tel" id="parentPhone" placeholder="Enter parent phone number">
            </div>

            <div class="form-group">
                <label for="photoUrl">Student Photo URL (Optional)</label>
                <input type="text" id="photoUrl" placeholder="Enter photo URL (e.g., https://example.com/photo.jpg)">
            </div>

            <div class="form-group">
                <label for="reason">Reason for Registration (Optional)</label>
                <textarea id="reason" placeholder="Enter any additional information or reason for this registration request"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-submit">Submit Request</button>
                <button type="button" class="btn btn-cancel" onclick="goBack()">Cancel</button>
            </div>
        </form>

        <div id="messageArea" class="message-area"></div>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <script src="script.js"></script>
    <script>
        const BASE_URL = 'http://localhost:5000/api';
        let currentUser = null;

        // Check authentication
        function checkAuth() {
            currentUser = getCurrentUser();
            
            if (!currentUser) {
                alert("Please login first.");
                window.location.href = "index.html";
                return false;
            }
            
            if (currentUser.role !== "staff") {
                alert("Access denied. This page is for staff only.");
                window.location.href = "index.html";
                return false;
            }
            
            return true;
        }

        // Load staff info
        function loadStaffInfo() {
            if (!checkAuth()) return;

            document.getElementById("staffName").textContent = currentUser.name || currentUser.username;
            document.getElementById("staffDepartment").textContent = currentUser.department || 'N/A';
            document.getElementById("staffYear").textContent = currentUser.year || 'N/A';

            // Pre-fill and restrict department and year
            const deptSelect = document.getElementById("department");
            const yearSelect = document.getElementById("year");

            if (currentUser.department) {
                deptSelect.value = currentUser.department;
                deptSelect.disabled = true;
            }

            if (currentUser.year && currentUser.year !== 'All') {
                yearSelect.value = currentUser.year;
                yearSelect.disabled = true;
            }
        }

        // Show message
        function showMessage(message, type = 'success') {
            const messageArea = document.getElementById("messageArea");
            messageArea.textContent = message;
            messageArea.className = `message-area ${type}`;
            messageArea.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    messageArea.style.display = 'none';
                }, 5000);
            }
        }

        // Show/hide loading
        function showLoading(show) {
            const overlay = document.getElementById("loadingOverlay");
            if (show) {
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        }

        // Validate form
        function validateForm() {
            const studentName = document.getElementById("studentName").value.trim();
            const studentId = document.getElementById("studentId").value.trim();
            const department = document.getElementById("department").value;
            const year = document.getElementById("year").value;

            if (!studentName) {
                showMessage("Please enter student name", "error");
                document.getElementById("studentName").focus();
                return false;
            }

            if (!studentId) {
                showMessage("Please enter register number", "error");
                document.getElementById("studentId").focus();
                return false;
            }

            // Validate register number format (basic)
            const regNoPattern = /^[A-Z0-9]+$/;
            if (!regNoPattern.test(studentId.toUpperCase())) {
                showMessage("Invalid register number format. Use only letters and numbers.", "error");
                document.getElementById("studentId").focus();
                return false;
            }

            if (!department) {
                showMessage("Please select department", "error");
                document.getElementById("department").focus();
                return false;
            }

            if (!year) {
                showMessage("Please select academic year", "error");
                document.getElementById("year").focus();
                return false;
            }

            // Validate phone numbers if provided
            const phone = document.getElementById("phone").value.trim();
            if (phone && !/^[\d\+\-\s]+$/.test(phone)) {
                showMessage("Invalid phone number format", "error");
                document.getElementById("phone").focus();
                return false;
            }

            const parentPhone = document.getElementById("parentPhone").value.trim();
            if (parentPhone && !/^[\d\+\-\s]+$/.test(parentPhone)) {
                showMessage("Invalid parent phone number format", "error");
                document.getElementById("parentPhone").focus();
                return false;
            }

            return true;
        }

        // Submit request
        async function submitRequest(e) {
            e.preventDefault();

            if (!validateForm()) return;

            const formData = {
                studentName: document.getElementById("studentName").value.trim(),
                studentId: document.getElementById("studentId").value.trim().toUpperCase(),
                department: document.getElementById("department").value,
                year: document.getElementById("year").value,
                section: document.getElementById("section").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                parentPhone: document.getElementById("parentPhone").value.trim(),
                photoUrl: document.getElementById("photoUrl").value.trim(),
                reason: document.getElementById("reason").value.trim()
            };

            showLoading(true);

            try {
                const token = localStorage.getItem("token");
                
                const response = await fetch(`${BASE_URL}/student-requests`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                showLoading(false);

                if (response.ok && data.success) {
                    showMessage("✅ Student registration request submitted successfully! Admin will review it soon.", "success");
                    document.getElementById("requestForm").reset();
                    loadStaffInfo(); // Reload to restore disabled fields
                    
                    // Redirect to my requests after 2 seconds
                    setTimeout(() => {
                        window.location.href = "my-requests.html";
                    }, 2000);
                } else {
                    showMessage("❌ " + (data.message || "Failed to submit request"), "error");
                }

            } catch (error) {
                showLoading(false);
                console.error("Error submitting request:", error);
                showMessage("❌ Network error. Please check your connection and try again.", "error");
            }
        }

        // Go back
        function goBack() {
            window.location.href = "home.html";
        }

        // Initialize
        document.addEventListener("DOMContentLoaded", function() {
            loadStaffInfo();
            document.getElementById("requestForm").addEventListener("submit", submitRequest);
        });
    </script>
</body>

</html>
