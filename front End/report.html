<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detailed Attendance Report</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        .detailed-report-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }

        .page-title {
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
        }

        .user-info {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .filter-section {
            background: none;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .filter-group select,
        .filter-group input[type="date"] {
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .filter-group select option {
            background: #1a1a1a;
            color: white;
        }

        .filter-group input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-actions button {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 120px;
        }

        .btn-generate {
            background-color: #007bff;
            color: white;
        }

        .btn-generate:hover {
            background-color: #0056b3;
        }

        .btn-students {
            background-color: #6f42c1;
            color: white;
        }

        .btn-students:hover {
            background-color: #5a2d91;
        }

        .btn-excel {
            background-color: #28a745;
            color: white;
        }

        .btn-excel:hover {
            background-color: #1e7e34;
        }

        .report-summary {
            text-align: center;
            color: white;
            font-size: 16px;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .detailed-report-table {
            width: 100%;
            border-collapse: collapse;
            background: transparent;
            margin: 20px 0;
            border-radius: 8px;
            overflow: hidden;
        }

        .detailed-report-table th {
            background: transparent;
            color: white;
            padding: 15px 10px;
            text-align: center;
            font-weight: bold;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            font-size: 14px;
        }

        .detailed-report-table td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }

        .detailed-report-table tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .student-name-cell {
            text-align: left !important;
            font-weight: 500;
        }

        .register-cell {
            font-family: monospace;
            font-weight: 500;
        }

        .percentage-cell {
            font-weight: bold;
        }

        .percentage-high {
            color: #4caf50 !important;
        }

        .percentage-medium {
            color: #ffeb3b !important;
        }

        .percentage-low {
            color: #ff6b6b !important;
        }

        .present-count {
            color: #4caf50;
            font-weight: 600;
        }

        .absent-count {
            color: #ff6b6b;
            font-weight: 600;
        }

        .no-data-row {
            color: #b3b3b3 !important;
            font-style: italic;
        }

        .back-section {
            text-align: center;
            margin: 30px 0;
        }

        .back-btn {
            padding: 12px 24px;
            background-color: transparent;
            color: white;
            border: 1px solid white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .message-area {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
        }

        .loading-message {
            color: #67e8f9;
        }

        .error-message {
            color: #ff6b6b;
        }

        .success-message {
            color: #4caf50;
        }

        .warning-message {
            color: #ffeb3b;
        }

        @media (max-width: 768px) {
            .filter-section {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .filter-actions {
                justify-content: center;
            }
            
            .detailed-report-table {
                font-size: 12px;
            }
            
            .detailed-report-table th,
            .detailed-report-table td {
                padding: 8px 6px;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <img src="img/logo.png" alt="Logo" class="logo" onerror="this.src='logo.png'">
        <h2 class="center" style="padding-left: 35%;">College Attendance System</h2>
    </header>

    <div class="detailed-report-container">
        <div id="userInfo" class="user-info"></div>
        <h1 class="page-title">Detailed Attendance Report</h1>

        <!-- Filter Section -->
        <div class="filter-section">
            <div class="filter-group">
                <label for="reportDepartment">Department:</label>
                <select id="reportDepartment" required>
                    <option value="" disabled selected>Select Department</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Tamil">Tamil</option>
                    <option value="English">English</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="reportYear">Year:</label>
                <select id="reportYear" required>
                    <option value="" disabled selected>Select Year</option>
                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="fromDate">From Date:</label>
                <input type="date" id="fromDate">
            </div>

            <div class="filter-group">
                <label for="toDate">To Date:</label>
                <input type="date" id="toDate">
            </div>

            <div class="filter-group">
                <div class="filter-actions">
                    <button class="btn-generate" onclick="generateReport()">Generate Report</button>
                    <button class="btn-students" onclick="viewStudentData()" title="View enrolled students for this class">Student List</button>
                    <button class="btn-excel" onclick="downloadReport()">Download PDF</button>
                </div>
            </div>
        </div>

        <!-- Report Summary -->
        <div id="reportSummary" class="report-summary" style="display: none;"></div>

        <!-- Report Table -->
        <table class="detailed-report-table" id="reportTable" style="display: none;">
            <thead id="reportHead">
                <tr>
                    <th>Serial</th>
                    <th>Register No</th>
                    <th>Name</th>
                    <th>Total Days</th>
                    <th>Present</th>
                    <th>Absent</th>
                    <th>%</th>
                </tr>
            </thead>
            <tbody id="reportBody"></tbody>
        </table>

        <!-- Message Area -->
        <div id="messageArea" class="message-area" style="display: none;"></div>

        <!-- Back Button -->
        <div class="back-section">
            <button class="back-btn" onclick="goBack()">Back to Dashboard</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Enhanced report functionality
        let currentReportType = 'attendance'; // 'attendance' or 'students'
        let currentUser = null;

        // Initialize page
        function initDetailedReport() {
            currentUser = getCurrentUser();
            
            if (!currentUser) {
                alert("Please login first.");
                window.location.href = "index.html";
                return;
            }

            // Display user info
            const userInfoEl = document.getElementById("userInfo");
            if (userInfoEl) {
                const roleName = currentUser.role === 'admin' ? 'Administrator' : 'Staff';
                userInfoEl.innerHTML = `Welcome, <strong>${currentUser.name || currentUser.username}</strong> | Role: <strong>${roleName}</strong>`;
            }

            // If staff user, lock dropdowns to their assigned department and year
            if (currentUser.role === 'staff') {
                const deptEl = document.getElementById("reportDepartment");
                const yearEl = document.getElementById("reportYear");
                
                if (deptEl && currentUser.department) {
                    deptEl.value = currentUser.department;
                    deptEl.disabled = true;
                }
                
                if (yearEl && currentUser.year && currentUser.year !== 'All') {
                    yearEl.value = currentUser.year;
                    yearEl.disabled = true;
                }
            }

            // Set default date range (last 30 days)
            const today = new Date();
            const lastMonth = new Date();
            lastMonth.setDate(today.getDate() - 30);
            
            const fromDateEl = document.getElementById("fromDate");
            const toDateEl = document.getElementById("toDate");
            
            if (fromDateEl) {
                fromDateEl.value = lastMonth.toISOString().split('T')[0];
            }
            if (toDateEl) {
                toDateEl.value = today.toISOString().split('T')[0];
            }
        }

        // Show/hide elements
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) el.style.display = "block";
        }

        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) el.style.display = "none";
        }

        function showMessage(message, type = 'info') {
            const messageEl = document.getElementById("messageArea");
            if (messageEl) {
                messageEl.className = `message-area ${type}-message`;
                messageEl.innerHTML = message;
                messageEl.style.display = "block";
            }
        }

        function clearMessage() {
            hideElement("messageArea");
        }

        // Enhanced generate report function
        function generateReport() {
            const deptEl = document.getElementById("reportDepartment");
            const yearEl = document.getElementById("reportYear");
            const fromEl = document.getElementById("fromDate");
            const toEl = document.getElementById("toDate");

            const department = deptEl ? deptEl.value.trim() : "";
            const year = yearEl ? yearEl.value.trim() : "";
            const fromDate = fromEl ? fromEl.value : "";
            const toDate = toEl ? toEl.value : "";

            // Validation
            if (!department) {
                alert("Please select a Department.");
                if (deptEl) deptEl.focus();
                return;
            }

            if (!year) {
                alert("Please select a Year.");
                if (yearEl) yearEl.focus();
                return;
            }

            if (!fromDate) {
                alert("Please select From date.");
                if (fromEl) fromEl.focus();
                return;
            }

            if (!toDate) {
                alert("Please select To date.");
                if (toEl) toEl.focus();
                return;
            }

            if (fromDate > toDate) {
                alert("From date cannot be after To date.");
                return;
            }

            currentReportType = 'attendance';
            clearMessage();
            showMessage("Generating detailed attendance report...", "loading");

            // Update table header for attendance report
            const thead = document.getElementById("reportHead");
            if (thead) {
                thead.innerHTML = `
                    <tr>
                        <th>Serial</th>
                        <th>Register No</th>
                        <th>Name</th>
                        <th>Total Days</th>
                        <th>Present</th>
                        <th>Absent</th>
                        <th>%</th>
                    </tr>
                `;
            }

            generateDetailedReport(department, year, fromDate, toDate);
        }

        // Enhanced generate detailed report
        function generateDetailedReport(department, year, fromDate, toDate) {
            try {
                initializeLocalStudents();
                
                // Get students for the selected class
                const allStudents = JSON.parse(localStorage.getItem("students")) || [];
                const classStudents = allStudents.filter(s => {
                    const sDept = (s.department || "").trim().toLowerCase();
                    const sYear = String(s.year || "").trim();
                    return sDept === department.toLowerCase() && sYear === year;
                });

                if (classStudents.length === 0) {
                    showMessage(`No students found for ${department} - Year ${year}. Please upload students first.`, "warning");
                    hideElement("reportTable");
                    hideElement("reportSummary");
                    return;
                }

                // Get attendance records for the date range
                const allLedger = JSON.parse(localStorage.getItem("all_attendance_ledger")) || [];
                const relevantEntries = allLedger.filter(entry => {
                    const matchDept = (entry.department || "").toLowerCase() === department.toLowerCase();
                    const matchYear = String(entry.year || "") === String(year);
                    const entryDate = entry.date;
                    return matchDept && matchYear && entryDate >= fromDate && entryDate <= toDate;
                });

                const totalRecordedDays = relevantEntries.length;
                
                // Generate report data
                const reportData = [];
                
                classStudents.forEach((student, index) => {
                    const studentId = (student.studentId || student.id || "").trim().toUpperCase();
                    const studentName = student.studentName || student.name || "Unknown";
                    
                    let presentDays = 0;
                    
                    // Count present days for this student
                    relevantEntries.forEach(entry => {
                        if (entry.records && Array.isArray(entry.records)) {
                            const studentRecord = entry.records.find(r => 
                                (r.studentId || "").trim().toUpperCase() === studentId
                            );
                            if (studentRecord && studentRecord.status === 'present') {
                                presentDays++;
                            }
                        }
                    });
                    
                    const absentDays = Math.max(0, totalRecordedDays - presentDays);
                    const percentage = totalRecordedDays > 0 ? 
                        Math.round((presentDays / totalRecordedDays) * 100) : 100;
                    
                    reportData.push({
                        serial: student.serial || (index + 1),
                        registerId: student.studentId || student.id || `STU${index + 1}`,
                        name: studentName,
                        totalDays: totalRecordedDays,
                        present: presentDays,
                        absent: absentDays,
                        percentage: percentage
                    });
                });

                // Sort by serial/name
                reportData.sort((a, b) => a.serial - b.serial || a.name.localeCompare(b.name));

                // Display results
                displayAttendanceReport(reportData, department, year, fromDate, toDate, totalRecordedDays);
                
            } catch (error) {
                console.error("Error generating report:", error);
                showMessage("Error generating report. Please try again.", "error");
            }
        }

        // Display attendance report
        function displayAttendanceReport(reportData, department, year, fromDate, toDate, totalDays) {
            const tbody = document.getElementById("reportBody");
            const summaryEl = document.getElementById("reportSummary");
            
            if (!tbody) return;
            
            // Update summary
            if (summaryEl) {
                const yearSuffix = year === '1' ? 'st' : year === '2' ? 'nd' : year === '3' ? 'rd' : 'th';
                summaryEl.innerHTML = `
                    <strong>Detailed Report:</strong> ${department} - ${year}${yearSuffix} Year | 
                    <strong>Period:</strong> ${fromDate} to ${toDate} | 
                    <strong>Students:</strong> ${reportData.length} | 
                    <strong>Recorded Days:</strong> ${totalDays}
                `;
                showElement("reportSummary");
            }
            
            // Clear and populate table
            tbody.innerHTML = "";
            
            if (reportData.length === 0) {
                tbody.innerHTML = `
                    <tr class="no-data-row">
                        <td colspan="7" style="padding: 25px; text-align: center;">
                            No attendance records found for the selected period.
                        </td>
                    </tr>
                `;
            } else {
                reportData.forEach(student => {
                    const row = document.createElement("tr");
                    
                    // Determine percentage color class
                    let percentageClass = "percentage-cell";
                    if (student.percentage >= 85) {
                        percentageClass += " percentage-high";
                    } else if (student.percentage >= 70) {
                        percentageClass += " percentage-medium";
                    } else {
                        percentageClass += " percentage-low";
                    }
                    
                    row.innerHTML = `
                        <td>${student.serial}</td>
                        <td class="register-cell">${student.registerId}</td>
                        <td class="student-name-cell">${student.name}</td>
                        <td>${student.totalDays}</td>
                        <td class="present-count">${student.present}</td>
                        <td class="absent-count">${student.absent}</td>
                        <td class="${percentageClass}">${student.percentage}%</td>
                    `;
                    
                    tbody.appendChild(row);
                });
            }
            
            showElement("reportTable");
            clearMessage();
            
            if (totalDays === 0) {
                showMessage("No attendance has been recorded for this class in the selected date range.", "warning");
            } else {
                showMessage(`✅ Report generated successfully! Showing ${reportData.length} students with ${totalDays} recorded days.`, "success");
            }
        }

        // Enhanced view student data
        function viewStudentData() {
            const deptEl = document.getElementById("reportDepartment");
            const yearEl = document.getElementById("reportYear");

            const department = deptEl ? deptEl.value.trim() : "";
            const year = yearEl ? yearEl.value.trim() : "";

            if (!department) {
                alert("Please select a Department to view student data.");
                if (deptEl) deptEl.focus();
                return;
            }

            if (!year) {
                alert("Please select a Year to view student data.");
                if (yearEl) yearEl.focus();
                return;
            }

            currentReportType = 'students';
            clearMessage();
            showMessage("Loading student list...", "loading");

            // Update table header for student list
            const thead = document.getElementById("reportHead");
            const isAdmin = currentUser && currentUser.role === 'admin';
            
            if (thead) {
                thead.innerHTML = `
                    <tr>
                        <th>Serial</th>
                        <th>Register No</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Year</th>
                        ${isAdmin ? '<th>Action</th>' : ''}
                    </tr>
                `;
            }

            displayStudentList(department, year);
        }

        // Display student list
        function displayStudentList(department, year) {
            try {
                initializeLocalStudents();
                
                const allStudents = JSON.parse(localStorage.getItem("students")) || [];
                const classStudents = allStudents.filter(s => {
                    const sDept = (s.department || "").trim().toLowerCase();
                    const sYear = String(s.year || "").trim();
                    return sDept === department.toLowerCase() && sYear === year;
                });

                const tbody = document.getElementById("reportBody");
                const summaryEl = document.getElementById("reportSummary");
                const isAdmin = currentUser && currentUser.role === 'admin';
                
                if (!tbody) return;

                // Update summary
                if (summaryEl) {
                    const yearSuffix = year === '1' ? 'st' : year === '2' ? 'nd' : year === '3' ? 'rd' : 'th';
                    summaryEl.innerHTML = `
                        <strong>Enrolled Students:</strong> ${department} - ${year}${yearSuffix} Year | 
                        <strong>Total Students:</strong> ${classStudents.length}
                    `;
                    showElement("reportSummary");
                }
                
                // Clear and populate table
                tbody.innerHTML = "";
                
                if (classStudents.length === 0) {
                    tbody.innerHTML = `
                        <tr class="no-data-row">
                            <td colspan="${isAdmin ? 6 : 5}" style="padding: 25px; text-align: center;">
                                No students found for ${department} - Year ${year}.<br>
                                Please upload students first using the Excel Upload feature.
                            </td>
                        </tr>
                    `;
                } else {
                    classStudents.forEach((student, index) => {
                        const row = document.createElement("tr");
                        
                        row.innerHTML = `
                            <td>${student.serial || (index + 1)}</td>
                            <td class="register-cell">${student.studentId || student.id || `STU${index + 1}`}</td>
                            <td class="student-name-cell">${student.studentName || student.name || "Unknown"}</td>
                            <td>${student.department}</td>
                            <td>Year ${student.year}</td>
                            ${isAdmin ? `<td><button class="back-btn" style="padding: 4px 12px; font-size: 12px;" onclick="deleteStudent('${student.studentId || student.id}', '${(student.studentName || student.name || '').replace(/'/g, "\\'")}')">Delete</button></td>` : ''}
                        `;
                        
                        tbody.appendChild(row);
                    });
                }
                
                showElement("reportTable");
                clearMessage();
                showMessage(`✅ Student list loaded! Showing ${classStudents.length} enrolled students.`, "success");
                
            } catch (error) {
                console.error("Error loading student data:", error);
                showMessage("Error loading student data. Please try again.", "error");
            }
        }

        // Delete student (admin only)
        function deleteStudent(studentId, studentName) {
            if (!currentUser || currentUser.role !== 'admin') {
                alert("Only administrators can delete student records.");
                return;
            }
            
            if (!confirm(`Are you sure you want to delete student ${studentName} (${studentId})?`)) {
                return;
            }
            
            try {
                let allStudents = JSON.parse(localStorage.getItem("students")) || [];
                const initialCount = allStudents.length;
                
                // Remove student from array
                allStudents = allStudents.filter(s => 
                    (s.studentId || s.id) !== studentId
                );
                
                if (allStudents.length < initialCount) {
                    localStorage.setItem("students", JSON.stringify(allStudents));
                    showMessage(`✅ Student ${studentName} deleted successfully.`, "success");
                    
                    // Refresh the current view
                    if (currentReportType === 'students') {
                        const deptEl = document.getElementById("reportDepartment");
                        const yearEl = document.getElementById("reportYear");
                        if (deptEl && yearEl) {
                            displayStudentList(deptEl.value, yearEl.value);
                        }
                    }
                } else {
                    showMessage("Student not found or could not be deleted.", "error");
                }
                
            } catch (error) {
                console.error("Error deleting student:", error);
                showMessage("Error deleting student. Please try again.", "error");
            }
        }

        // Enhanced download functionality
        function downloadReport() {
            const deptEl = document.getElementById("reportDepartment");
            const yearEl = document.getElementById("reportYear");

            const department = deptEl ? deptEl.value.trim() : "";
            const year = yearEl ? yearEl.value.trim() : "";

            if (!department || !year) {
                alert("Please select Department and Year first.");
                return;
            }

            const table = document.getElementById("reportTable");
            const tbody = document.getElementById("reportBody");

            if (!table || !tbody || tbody.children.length === 0 || tbody.innerText.includes("No students found") || tbody.innerText.includes("No attendance records")) {
                alert("No data available to download. Please generate a report or view student data first.");
                return;
            }

            try {
                if (typeof window.jspdf === 'undefined') {
                    alert("PDF library not loaded. Please refresh the page and try again.");
                    return;
                }

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                const deptName = department;
                const yearName = `Year ${year}`;
                const timestamp = new Date().toISOString().split('T')[0];
                
                let filename = "";
                let title = "";
                let subtitle = "";

                if (currentReportType === 'students') {
                    // Student List PDF
                    filename = `Student_List_${department.replace(/\s+/g, '_')}_${yearName.replace(/\s+/g, '_')}_${timestamp}.pdf`;
                    title = 'Student List Report';
                    subtitle = `${department} - ${yearName}`;
                    
                    // Get table data
                    const thead = document.getElementById("reportHead");
                    const headers = [];
                    thead.querySelectorAll('th').forEach((th, index) => {
                        if (th.textContent.trim() !== 'Action') {
                            headers.push(th.textContent.trim());
                        }
                    });
                    
                    const tableData = [];
                    tbody.querySelectorAll('tr').forEach(tr => {
                        const row = [];
                        tr.querySelectorAll('td').forEach((td, index) => {
                            if (!td.querySelector('button')) {
                                row.push(td.textContent.trim());
                            }
                        });
                        if (row.length > 0) tableData.push(row);
                    });
                    
                    // Add title
                    doc.setFontSize(18);
                    doc.setFont(undefined, 'bold');
                    doc.text(title, 14, 15);
                    
                    doc.setFontSize(12);
                    doc.setFont(undefined, 'normal');
                    doc.text(subtitle, 14, 25);
                    doc.text(`Total Students: ${tableData.length}`, 14, 32);
                    
                    // Add table
                    doc.autoTable({
                        startY: 40,
                        head: [headers],
                        body: tableData,
                        theme: 'grid',
                        headStyles: {
                            fillColor: [111, 66, 193],
                            textColor: 255,
                            fontStyle: 'bold'
                        },
                        styles: {
                            fontSize: 9,
                            cellPadding: 2
                        }
                    });
                    
                } else {
                    // Attendance Report PDF
                    const fromEl = document.getElementById("fromDate");
                    const toEl = document.getElementById("toDate");
                    const fromDate = fromEl ? fromEl.value : "";
                    const toDate = toEl ? toEl.value : "";
                    
                    filename = `Attendance_Report_${department.replace(/\s+/g, '_')}_${yearName.replace(/\s+/g, '_')}_${fromDate}_to_${toDate}.pdf`;
                    title = 'Detailed Attendance Report';
                    subtitle = `${department} - ${yearName}`;
                    
                    // Get table data
                    const thead = document.getElementById("reportHead");
                    const headers = [];
                    thead.querySelectorAll('th').forEach(th => {
                        headers.push(th.textContent.trim());
                    });
                    
                    const tableData = [];
                    tbody.querySelectorAll('tr').forEach(tr => {
                        const row = [];
                        tr.querySelectorAll('td').forEach(td => {
                            row.push(td.textContent.trim());
                        });
                        if (row.length > 0) tableData.push(row);
                    });
                    
                    // Add title
                    doc.setFontSize(18);
                    doc.setFont(undefined, 'bold');
                    doc.text(title, 14, 15);
                    
                    doc.setFontSize(12);
                    doc.setFont(undefined, 'normal');
                    doc.text(subtitle, 14, 25);
                    doc.text(`Period: ${fromDate} to ${toDate}`, 14, 32);
                    doc.text(`Total Students: ${tableData.length}`, 14, 39);
                    
                    // Add table
                    doc.autoTable({
                        startY: 47,
                        head: [headers],
                        body: tableData,
                        theme: 'grid',
                        headStyles: {
                            fillColor: [0, 123, 255],
                            textColor: 255,
                            fontStyle: 'bold'
                        },
                        styles: {
                            fontSize: 8,
                            cellPadding: 2
                        },
                        columnStyles: {
                            2: { cellWidth: 40 },  // Name column wider
                            6: { fontStyle: 'bold' }  // Percentage column bold
                        },
                        didParseCell: function(data) {
                            // Color code percentages
                            if (data.column.index === 6 && data.section === 'body') {
                                const value = data.cell.raw;
                                if (value && value.includes('%')) {
                                    const percentValue = parseInt(value.replace('%', ''));
                                    if (!isNaN(percentValue)) {
                                        if (percentValue >= 85) {
                                            data.cell.styles.textColor = [0, 128, 0];
                                        } else if (percentValue >= 70) {
                                            data.cell.styles.textColor = [255, 165, 0];
                                        } else {
                                            data.cell.styles.textColor = [255, 0, 0];
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
                
                // Add footer
                const pageCount = doc.internal.getNumberOfPages();
                const pageHeight = doc.internal.pageSize.height;
                
                for (let i = 1; i <= pageCount; i++) {
                    doc.setPage(i);
                    doc.setFontSize(8);
                    doc.setFont(undefined, 'normal');
                    doc.text(
                        `Generated on: ${new Date().toLocaleString()} | Page ${i} of ${pageCount}`,
                        14,
                        pageHeight - 10
                    );
                }
                
                // Download PDF
                doc.save(filename);
                
                showMessage(`✅ PDF downloaded successfully!`, "success");

            } catch (error) {
                console.error("PDF export error:", error);
                alert("Failed to download PDF: " + error.message);
            }
        }

        function goBack() {
            if (currentUser && currentUser.role === 'admin') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'home.html';
            }
        }

        // Initialize when page loads
        document.addEventListener("DOMContentLoaded", function() {
            initDetailedReport();
        });
    </script>
</body>

</html>
